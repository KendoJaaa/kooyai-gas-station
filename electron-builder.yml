appId: com.kooyai.gasbook
productName: Kooyai
copyright: Copyright © 2026 KendoJaaa
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,bun.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.map'
extraResources:
  - from: resources/company-db.json
    to: company-db.json
  - from: resources/apply-update.cmd
    to: apply-update.cmd
asarUnpack:
  - resources/**
  - node_modules/mongodb/**
  - node_modules/bson/**
win:
  icon: build/icon.png
  executableName: kooyai
  target:
    - nsis
    - zip
nsis:
  include: build/installer.nsh
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
npmRebuild: false
publish: null
